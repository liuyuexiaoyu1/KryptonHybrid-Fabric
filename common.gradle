final int mcVersion = project.mcVersion
final boolean unobfuscated = mcVersion >= 26_00_00

apply plugin: 'maven-publish'
apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'
apply plugin: 'com.replaymod.preprocess'

repositories {
	mavenCentral()
	maven { url = 'https://maven.fabricmc.net/' }
	maven {
		name = 'ParchmentMC'
		url = 'https://maven.parchmentmc.org'
	}
	maven {
		url = 'https://repo.papermc.io/repository/maven-public/'
	}
	maven {
		url = 'https://maven.fallenbreath.me/jitpack'
		content { includeGroupAndSubgroups('com.github') }
	}
	maven {url = 'https://maven.fallenbreath.me/releases'
		content {includeGroupAndSubgroups("me.fallenbreath")}
	}
	maven {
		name = 'ViaVersion'
		url = 'https://repo.viaversion.com/'
	}
	maven {
		name = 'Raphimc'
		url = 'https://maven.raphimc.net/repository/raphimc-maven/'
	}
}

// https://github.com/FabricMC/fabric-loader/issues/783
configurations {
	modRuntimeOnly.exclude group: 'net.fabricmc', module: 'fabric-loader'
}

dependencies {
    def processDependency = { dep ->
        // https://github.com/FabricMC/fabric-loader/issues/783
        if (dep instanceof ModuleDependency && !(dep.group == 'net.fabricmc' && dep.name == 'fabric-loader')) {
            dep.exclude group: 'net.fabricmc', module: 'fabric-loader'
            dep.exclude group: 'com.github.astei', module: 'lazydfu'
            dep.exclude group: 'com.github.2No2Name', module: 'McTester'
        }
        return dep
    }
    def autoImplementation = { Object... args -> processDependency(unobfuscated ? implementation(*args) : modImplementation(*args)) }
	def autoRuntimeOnly = { Object... args -> processDependency(unobfuscated ? runtimeOnly(*args) : modRuntimeOnly(*args)) }
	// Minecraft
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (!unobfuscated) {
        mappings loom.layered() {
            officialMojangMappings()
			parchment("org.parchmentmc.data:parchment-${project.minecraft_version}:${project.parchment_version}@zip")
        }
    }

    autoImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    autoImplementation ("net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}")

    // Krypton compression dependencies (pure java libs, no remapping needed)
    implementation include("com.github.luben:zstd-jni:${project.zstd_jni_version}")
    implementation include("com.velocitypowered:velocity-native:${project.velocity_native_version}")

    // ViaVersion / ViaFabric / ViaFabricPlus — compileOnly (optional): the mod
    // loads via-compat mixins only when the user has Via installed at runtime.
    compileOnly "com.viaversion:viaversion:${project.via_version}"
    compileOnly "net.raphimc:viafabric:${project.viafabric_version}"
    compileOnly "net.raphimc:viafabricplus:${project.viafabricplus_version}"
    // ViaFabricPlus 4.x moved to com.viaversion.viafabricplus — compile both so
    // the via-compat protocol-version query works on 3.x and 4.x installs.
    compileOnly "com.viaversion:viafabricplus:${project.viafabricplus_v4_version}"
	if (!unobfuscated) {
		// 0.2.0-o: JAVA_8 compat level, works on the Java 21 runtime used by 1.21.x
		autoRuntimeOnly ('me.fallenbreath:mixin-auditor:0.2.0-o') {
			exclude group: "net.fabricmc.fabric-api"
		}
	} else {
		// 0.2.0-u: JAVA_25 compat level, matches the Java 25 runtime used by 26.x
		autoRuntimeOnly ('me.fallenbreath:mixin-auditor:0.2.0-u') {
			exclude group: "net.fabricmc.fabric-api"
		}
	}
}

String MIXIN_CONFIG_PATH = 'krypton_hybrid.mixins.json'
// Unified Java 25 toolchain (class version 69): required to compile against
// ViaFabricPlus 4.x (built with Java 25) for the via-compat version query.
// Note: runtimes must use Java 25 as well.
JavaVersion JAVA_COMPATIBILITY = JavaVersion.VERSION_25

JavaVersion MIXIN_COMPATIBILITY_LEVEL = JAVA_COMPATIBILITY

loom {
    accessWidenerPath = file("src/main/resources/krypton_hybrid.accesswidener")
	def commonVmArgs = ['-Dmixin.debug.export=true', '-Dmixin.debug.countInjections=false']
	runConfigs.configureEach {
		// to make sure it generates all "Minecraft Client (:subproject_name)" applications
		ideConfigGenerated = true
		runDir '../../run'
	}
	runs {
		// run server, but with mixin auditor enabled
		serverMixinAudit {
			server()
			vmArgs(*commonVmArgs, '-DmixinAuditor.audit=true')
		}

		// run client, but with mixin auditor enabled
		clientMixinAudit {
			client()
			vmArgs(*commonVmArgs, '-DmixinAuditor.audit=true', '-DmixinAuditor.when=game_init')
		}
	}
}

String modVersionSuffix = ''
String artifactVersion = project.mod_version
String artifactVersionSuffix = ''
// detect github action environment variables
// https://docs.github.com/en/actions/learn-github-actions/environment-variables#default-environment-variables
if (System.getenv("BUILD_RELEASE") != "true") {
	String buildNumber = System.getenv("BUILD_ID")
	modVersionSuffix += buildNumber != null ? ('+build.' + buildNumber) : '-SNAPSHOT'
	artifactVersionSuffix = '-SNAPSHOT'  // A non-release artifact is always a SNAPSHOT artifact
}
String fullModVersion = project.mod_version + modVersionSuffix
String fullProjectVersion, fullArtifactVersion

fullProjectVersion = 'v' + project.mod_version + '-mc' + project.minecraft_version + modVersionSuffix
fullArtifactVersion = artifactVersion + '-mc' + project.minecraft_version + artifactVersionSuffix

group = project.mod_group_id
base.archivesName = project.mod_id
version = fullProjectVersion

processResources {
	inputs.property "version", fullModVersion
	inputs.property "minecraft_dependency", project.minecraft_dependency
	inputs.property "loader_version", project.loader_version

	filesMatching("fabric.mod.json") {
		def valueMap = [
				"version": fullModVersion,
				"minecraft_dependency": project.minecraft_dependency,
				"loader_version": project.loader_version,
		]
		expand valueMap
	}

	filesMatching(MIXIN_CONFIG_PATH) {
		filter { s -> s.replace('{{COMPATIBILITY_LEVEL}}', "JAVA_${MIXIN_COMPATIBILITY_LEVEL.ordinal() + 1}") }
	}
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
	options.release = JAVA_COMPATIBILITY.majorVersion.toInteger()
	options.compilerArgs << "-Xlint:deprecation" << "-Xlint:unchecked"
}

java {
	sourceCompatibility = JAVA_COMPATIBILITY
	targetCompatibility = JAVA_COMPATIBILITY
	toolchain.languageVersion = JavaLanguageVersion.of(JAVA_COMPATIBILITY.majorVersion)

	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

jar {
	from(rootProject.file('LICENSE')) {
		rename { "${it}" }
	}
}

tasks.register('trainZstdDict', JavaExec) {
	group = 'krypton'
	description = 'Train a Zstd dictionary from sample files using the Java 25 toolchain.'
	dependsOn tasks.named('classes')

	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(25)
	}

	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.xinian.KryptonHybrid.tool.ZstdDictionaryTrainer'

	def samplesDirProp = providers.gradleProperty('samplesDir')
	def outputDictProp = providers.gradleProperty('outputDict')
	def dictSizeProp = providers.gradleProperty('dictSize')
	def maxSamplesProp = providers.gradleProperty('maxSamples')
	def minSampleBytesProp = providers.gradleProperty('minSampleBytes')
	def maxSampleBytesProp = providers.gradleProperty('maxSampleBytes')
	def evalSamplesProp = providers.gradleProperty('evalSamples')

	doFirst {
		def samplesDir = samplesDirProp.orNull
		if (!samplesDir) {
			throw new GradleException('Missing -PsamplesDir=<path>')
		}

		def outputDict = outputDictProp.orElse('config/krypton_hybrid.zdict').get()
		def dictSize = dictSizeProp.orElse('65536').get()
		def maxSamples = maxSamplesProp.orElse('8000').get()
		def minSampleBytes = minSampleBytesProp.orElse('8').get()
		def maxSampleBytes = maxSampleBytesProp.orElse('2097152').get()
		def evalSamples = evalSamplesProp.orElse('1000').get()

		args samplesDir.toString(), outputDict.toString(), dictSize.toString(), maxSamples.toString(),
				minSampleBytes.toString(), maxSampleBytes.toString(), evalSamples.toString()
	}
}

tasks.register('inspectZstdDict', JavaExec) {
	group = 'krypton'
	description = 'Inspect and validate a Krypton/Zstd dictionary file.'
	dependsOn tasks.named('classes')

	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(25)
	}

	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.xinian.KryptonHybrid.tool.ZstdDictionaryTrainer'

	def dictPathProp = providers.gradleProperty('dictPath')

	doFirst {
		def dictPath = dictPathProp.orElse('config/krypton_hybrid.zdict').get()
		args 'inspect', dictPath.toString()
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
			artifactId = base.archivesName.get()
			version = fullArtifactVersion
		}
	}

	// select the repositories you want to publish to
	repositories {
	}
}
